name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Lua files
        uses: nebularg/actions-luacheck@v1.1.2
        with:
          args: "--no-color -q --no-self"
          annotate: warning

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create package
        uses: BigWigsMods/packager@v2
        with:
          args: -d
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaylaidCrateHelper
          path: .release/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upload locale strings to CurseForge
        run: ./CurseForge_UpldateTranslations.sh
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
      - name: Create and publish package
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
